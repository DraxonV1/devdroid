name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    name: GitHub Release & Extension Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Extension ZIP
        run: |
          cd ext
          zip -r ../devdroid.zip manifest.json background.js command_runner.js webrequest_handler.js popup.html popup.js popup.css options.html options.js
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: devdroid.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Copy README and LICENSE to js/
        run: |
          cp README.md LICENSE js/

      - name: Install dependencies
        run: |
          cd js
          npm ci || npm install

      # Publishes using OIDC Trusted Publishing; if already published, continues gracefully
      - name: Publish to NPM
        run: |
          cd js
          npm publish --provenance --access public || echo "Version already published or token skipped"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-and-release
    environment:
      name: pypi
      url: https://pypi.org/p/devdroid
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      # PyPI Trusted Publishing via OIDC token
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
